name: Deploy Odoo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d /home/ubuntu/odoo_app ]; then
              git clone https://github.com/ajaykhatii/odoo_app.git /home/ubuntu/odoo_app
            fi

            cd /home/ubuntu/odoo_app
            git pull origin main
            docker compose down
            docker compose up -d --build
